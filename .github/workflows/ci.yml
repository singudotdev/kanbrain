# Checks every push and pull request: formatting, lints and tests of the command line and the kanban app
# on all three platforms.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run's result moot: stop it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # What the kanban app (GPUI) needs to build on Linux; the command line needs nothing.
  GUI_LINUX_DEPS: libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    # Every job gets one: a hung test or e2e server would otherwise hold a runner for GitHub's default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          # shellcheck disable=SC2086 # one package per word
          sudo apt-get update && sudo apt-get install -y $GUI_LINUX_DEPS
      - run: cargo fmt --all --check
      # The lint policy (pedantic, no unsafe) lives in Cargo.toml; here any warning fails the build.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Broken intra-doc links and malformed doc comments.
      - run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # The crates published to crates.io package and build as published, before a tag makes them a release.
      - run: cargo publish --dry-run --locked -p kanbrain-core -p kanbrain

  deny:
    name: licenses + advisories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # deny.toml: licenses an AGPL-3.0-only program may include, the allowed git sources, and the advisories
      # ignored with their reason. A new advisory fails the build until it's fixed or ignored there.
      - uses: EmbarkStudios/cargo-deny-action@v2
      # The third-party notices the release archives carry: they must keep generating, with every license accepted.
      - uses: dtolnay/rust-toolchain@stable
      # cargo-about resolves the whole dependency graph, GPUI's git repository included.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices
        run: |
          cargo xtask notices kb > /dev/null
          cargo xtask notices kanbrain > /dev/null

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2086 # one package per word
          sudo apt-get update && sudo apt-get install -y $GUI_LINUX_DEPS
      - run: cargo test --workspace --locked

  installers:
    name: installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Static checks first: shellcheck is on Ubuntu's runners.
      - if: runner.os == 'Linux'
        run: shellcheck install.sh e2e/install.sh e2e/agent.sh gui/icons/make.sh
      # PowerShell's own analyzer, failing on what it rates an error.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path install.ps1, e2e/install.ps1 -Severity Error -EnableExit
      # This build installed by the installer users run, from a local copy of a release: checksum, a refused bad
      # one, `init --all` updating a registered project, the app's launcher, uninstalling and purging (see the
      # scripts' headers).
      - if: runner.os != 'Windows'
        run: e2e/install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./e2e/install.ps1

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with `rust-version` in core/Cargo.toml and cli/Cargo.toml. The kanban app follows GPUI's
      # own requirements instead, so this checks the default members: the core and the command line.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
