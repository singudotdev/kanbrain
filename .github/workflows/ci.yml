# Checks every push and pull request: formatting, lints and tests of the command line and the kanban app
# on all three platforms. Each job runs only when the change touches what it checks, and none for a tree a passing
# run already checked (see .github/plan.sh).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  # To find the run a tree passed in, and the last commit whose run passed (.github/plan.sh).
  actions: read

# A newer push to the same branch or pull request makes the older run's result moot: stop it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # What the kanban app (GPUI) needs to build on Linux; the command line needs nothing.
  GUI_LINUX_DEPS: libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lint: ${{ steps.plan.outputs.lint }}
      deny: ${{ steps.plan.outputs.deny }}
      test: ${{ steps.plan.outputs.test }}
      msrv: ${{ steps.plan.outputs.msrv }}
      installers: ${{ steps.plan.outputs.installers }}
      upgrade: ${{ steps.plan.outputs.upgrade }}
      app: ${{ steps.plan.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit the change is measured from, however far back.
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: .github/plan.sh ci
      # This run's tree, for a later run of the same tree to find (.github/plan.sh).
      - uses: actions/upload-artifact@v7
        with:
          name: ci-tree-${{ steps.plan.outputs.tree }}
          path: .github/plan.sh
          retention-days: 90
          overwrite: true

  # Lints and docs on each system, as code behind `cfg(windows)`, `cfg(not(unix))` or a non-Linux `target_os` is
  # only compiled there; formatting and packaging don't depend on it.
  lint:
    name: fmt + clippy (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.lint == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Every job gets one: a hung test or e2e server would otherwise hold a runner for GitHub's default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2086 # one package per word
          sudo apt-get update && sudo apt-get install -y $GUI_LINUX_DEPS
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      # The lint policy (pedantic, no unsafe) lives in Cargo.toml; here any warning fails the build.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Broken intra-doc links and malformed doc comments.
      - run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # The crates published to crates.io package and build as published, before a tag makes them a release.
      - if: runner.os == 'Linux'
        run: cargo publish --dry-run --locked -p kanbrain-core -p kanbrain

  deny:
    name: licenses + advisories
    needs: plan
    if: needs.plan.outputs.deny == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # deny.toml: licenses an AGPL-3.0-only program may include, the allowed git sources, and the advisories
      # ignored with their reason. A new advisory fails the build until it's fixed or ignored there.
      - uses: EmbarkStudios/cargo-deny-action@v2
      # The third-party notices the release archives carry: they must keep generating, with every license accepted.
      - uses: dtolnay/rust-toolchain@stable
      # cargo-about resolves the whole dependency graph, GPUI's git repository included.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices
        run: |
          cargo xtask notices kb > /dev/null
          cargo xtask notices kanbrain > /dev/null

  test:
    name: test (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.test == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2086 # one package per word
          sudo apt-get update && sudo apt-get install -y $GUI_LINUX_DEPS
      - run: cargo test --workspace --locked

  installers:
    name: installers (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.installers == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Static checks first: shellcheck is on Ubuntu's runners.
      - if: runner.os == 'Linux'
        run: shellcheck -x install.sh e2e/lib.sh e2e/install.sh e2e/agent.sh e2e/upgrade.sh e2e/update.sh e2e/smoke-app.sh gui/icons/make.sh .github/plan.sh
      # PowerShell's own analyzer, failing on what it rates an error.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          # -Path takes one file, and -EnableExit would stop after the first: gather them, then fail on any.
          $found = 'install.ps1', 'e2e/install.ps1', 'e2e/smoke-app.ps1' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error }
          $found
          if ($found) { exit 1 }
      # This build installed by the installer users run, from a local copy of a release: checksum, a refused bad
      # one, `init --all` updating a registered project, the app's launcher, uninstalling and purging (see the
      # scripts' headers).
      - if: runner.os != 'Windows'
        run: e2e/install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./e2e/install.ps1
      # Again in Windows PowerShell 5.1, which install.ps1 supports and which reads files and output differently.
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./e2e/install.ps1

  # Brains written by every released `kb` open with this build and lose nothing, and every released `kb update`
  # installs it (see the scripts' headers).
  upgrade:
    name: upgrade from released versions
    needs: plan
    if: needs.plan.outputs.upgrade == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags it downloads each `kb` of.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: e2e/upgrade.sh
      - run: e2e/update.sh

  # The kanban app as released starts, stays up and idles on each system; the screenshot is kept to look at.
  app-smoke:
    name: app smoke (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A display with no GPU: Xvfb, with Mesa's software Vulkan; ImageMagick for the screenshot.
      - if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2086 # one package per word
          sudo apt-get update && sudo apt-get install -y $GUI_LINUX_DEPS xvfb mesa-vulkan-drivers imagemagick
      - run: cargo build --release --locked -p kanbrain-app
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" e2e/smoke-app.sh
      - if: runner.os == 'macOS'
        run: e2e/smoke-app.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./e2e/smoke-app.ps1
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-smoke-${{ runner.os }}
          path: target/smoke
          if-no-files-found: ignore

  msrv:
    name: minimum Rust version
    needs: plan
    if: needs.plan.outputs.msrv == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with `rust-version` in the workspace's Cargo.toml, which the core and the command line inherit.
      # The kanban app follows GPUI's own requirements instead, so this checks the default members.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
