# cargo-mutants (`cargo mutants --in-diff`, the CI's `mutants` job): mutants no test can tell apart, each with why.
# A new exclusion needs the same: a missed mutant is otherwise a test to write.

# Every package's tests for every mutant: the core's command line is tested through the `kb` binary, in the
# `kanbrain` package (cli/tests/kb.rs), which a core-only run wouldn't build.
test_workspace = true
# The baseline runs alone, mutants side by side (`-j`): their tests run slower than it did, so a timeout scaled from
# it alone would cut good runs short and call them timeouts.
minimum_test_timeout = 300
exclude_re = [
    # Starts the installer and the app's processes: run by the installers' end-to-end checks, not by tests.
    'gui/src/update\.rs:.*replace (install|install_after_exit|install_now) -> Result',
    # The hover style of a list row: the window tests have no pointer to hover with.
    'gui/src/ui/list\.rs:.*delete ! in row',
    # The highlight of the form's tags list (by its line, so the row the list follows stays tested): a color, and the
    # window tests read bounds, not colors (the state tests check which tag it is, `Form::tag_sel`).
    'gui/src/ui/dialogs/form\.rs:168:.*replace == with != in tags_field',
    # Runs the user's editor and waits for it: the choice of editor (`editor_of`) is what tests check.
    'gui/src/ui/mod\.rs:.*(replace open_editor -> Result| in open_editor$)',
    # A leftover exactly CUT_WRITE_AGE old, to the nanosecond, is the only one `>=` would delete too.
    'core/src/store\.rs:.*replace > with >= in forget_cut_writes',
    # Where a one-line field scrolls for its cursor: the cursor exactly on an edge, or exactly SLACK past it, to the
    # sub-pixel, is the only place these tell apart.
    'gui/src/ui/caret\.rs:.*replace (> with >=|< with <=|<= with <) in keep_in_view',
    # Which row of the editor draws the cursor (`index == row`, by its line, so the selection's rows stay tested):
    # painted, and the window tests read bounds, not what's painted.
    'gui/src/ui/dialogs/editor\.rs:56:.*replace == with != in draw',
    # Which field a mouse press makes the one typed into: the state tests drive keys, and the window tests read bounds
    # without a pointer to press with.
    'gui/src/ui/pointer\.rs:.*replace focus with \(\)',
    # Downloads the installer from GitHub and runs it: the installer is checked by e2e/install.sh, not by tests.
    'core/src/cli/update\.rs:.*(replace run_installer -> Result| in run_installer$)',
    # The conflict just picked is never among those left to pick, so `>=` finds the same one after it as `>`.
    'gui/src/text/merge\.rs:.*replace > with >= in Merge::pick_at$',
    # The highlight of a conflict's pick: a color and a weight, and the window tests read bounds, not colors (the
    # state tests check what's picked, `Conflict::pick`).
    'gui/src/ui/dialogs/merge\.rs:.*replace == with != in conflict_box$',
    # No waits for a busy file is what `busy_delays` gives off Windows, where the mutants run.
    'core/src/store\.rs:.*replace busy_delays -> &.static\[Duration\] with Vec::leak\(Vec::new\(\)\)',
]
