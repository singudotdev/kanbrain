[workspace]
resolver = "3"
members = ["core", "cli", "gui", "xtask"]
# `cargo build` / `cargo test` at the top cover the command line only, which builds fast and on Rust 1.100.
# The kanban app needs GPUI: add `-p kanbrain-app` or `--workspace` (see docs/development.md).
default-members = ["core", "cli"]

[workspace.package]
version = "0.7.4"
edition = "2024"
# The core's and the command line's, which CI's "minimum Rust version" job builds with; the kanban app follows
# GPUI's requirements instead, so it doesn't inherit it.
rust-version = "1.100"
repository = "https://github.com/singudotdev/kanbrain"
license = "AGPL-3.0-only"

[workspace.dependencies]
# The version is what crates.io resolves it to: keep it at the workspace version.
kanbrain-core = { path = "core", version = "0.7.4" }
anyhow = "1.0.104"
# Times: the files' timestamps in local time, report periods, ages and durations. In chrono's place, unmaintained
# (RUSTSEC-2026-0543): see docs/decisions/0014-times-with-jiff-not-chrono.md.
jiff = "1.0.1"
dirs = "7"
# The effective user id for the root check, without `unsafe` (already in the tree through tempfile and GPUI).
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
# A brain's write lock, so commands an agent runs in parallel don't overwrite each other's changes. Chosen when the
# minimum Rust was 1.88, before std's `File::lock` (1.89).
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order: settings files `init` merges into keep their keys in the order they had.
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every item says why it exists, private ones too: most of this code is private to its crate.
missing_docs_in_private_items = "warn"
# Binaries and a crate only they use: no public API to document errors and panics for, or to mark #[must_use].
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[profile.release]
strip = true
lto = true

# The patches Zed 1.29.2 builds GPUI with (from its workspace Cargo.toml and Cargo.lock), for the kanban app;
# a git dependency doesn't carry them over. The command line doesn't use these crates.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
