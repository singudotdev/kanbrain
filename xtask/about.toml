# cargo-about's settings for `cargo xtask notices`, which writes the THIRD-PARTY-LICENSES.txt every release
# archive carries.
# The licenses deny.toml accepts, and this workspace's own, whose crates `notices` leaves out.
accepted = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
# Only what ends up in the binaries: build scripts, proc macros' build tools and tests don't.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Every platform a release is built for, so one file per program covers all of its archives.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
